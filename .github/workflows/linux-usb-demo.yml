name: Linux guest dual-HID evaluation
on:
  push:
    branches: [main, qualification/linux-dual-hid]
    paths: ['lab/linux-usb-demo/**', 'lab/qemu-usb-demo/run.py', '.github/workflows/linux-usb-demo.yml']
  pull_request:
    paths: ['lab/linux-usb-demo/**', 'lab/qemu-usb-demo/run.py', '.github/workflows/linux-usb-demo.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install public distro kernel and build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends linux-image-generic qemu-system-x86 busybox-static cpio gcc libc6-dev kmod zstd xz-utils
      - name: Build boot workset and qualify actual guest HID
        run: |
          bash lab/linux-usb-demo/build.sh "$RUNNER_TEMP/linux-demo-build"
          python3 -I lab/linux-usb-demo/run.py "$RUNNER_TEMP/linux-demo-build" "$RUNNER_TEMP/linux-demo-evidence"
          (cd "$RUNNER_TEMP/linux-demo-evidence" && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-guest-usb-evaluation
          path: ${{ runner.temp }}/linux-demo-evidence/
          retention-days: 7
          if-no-files-found: error
