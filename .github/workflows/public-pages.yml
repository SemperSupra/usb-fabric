name: Public documentation
on:
  pull_request:
    paths: ['site/**', 'scripts/build-public-pages.py', 'PUBLICATION.md', '.github/workflows/public-pages.yml']
  push:
    branches: [main]
    paths: ['site/**', 'scripts/build-public-pages.py', 'PUBLICATION.md', '.github/workflows/public-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate and materialize only the public site
        run: |
          python3 -I scripts/build-public-pages.py "$RUNNER_TEMP/public-site"
          test -s "$RUNNER_TEMP/public-site/index.html"
      - name: Upload documentation for deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/public-site
          retention-days: 1
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: public-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation only
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
