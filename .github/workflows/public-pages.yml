name: Public documentation
on:
  pull_request:
    paths: ['site/**', 'scripts/build-public-pages.py', 'PUBLICATION.md', '.github/workflows/public-pages.yml']
  push:
    branches: [main]
    paths: ['site/**', 'scripts/build-public-pages.py', 'PUBLICATION.md', '.github/workflows/public-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate and materialize only the public site
        run: |
          python3 -I scripts/build-public-pages.py "$RUNNER_TEMP/public-site"
          test -s "$RUNNER_TEMP/public-site/index.html"
      - name: Package public documentation (no deployment permissions)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/public-site
          retention-days: 1
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PUBLIC_PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: public-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation only
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
