name: USB Fabric actual scoped TCP fence witness
on:
  push:
    branches: [test/issue-8-live-network-witness]
permissions:
  contents: read
concurrency:
  group: usb-fabric-live-tcp-witness
  cancel-in-progress: false
jobs:
  live-scoped-network-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Original scoped owner and actual TCP child witness
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
          GOWORK: 'off'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 1957a30e5ebc968a1e6de4b0fad1c66549f0a3c9
          cd experiments/usb-fabric-r26/integrated/
          go version
          go test -race -count=3 -timeout=120s ./...
          go vet ./...
          go test -race -count=10 -timeout=120s -v ./blue -run '^TestScopedOwnerLiveTCPWitness$'
