name: Managed USB diagnostics corrective qualification
on:
  pull_request:
    branches: [integration/issue-3-p0-durable-prerequisites]
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  managed-diagnostics:
    if: ${{ github.event.pull_request.head.ref == 'fix/managed-usb-id-diagnostics' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.sha == '3c1f75ddd728e1edeca4891e0cfc00b1f294e79c' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check historical baseline and bounded delta
        run: |
          set -Eeuo pipefail
          git worktree add --detach "$RUNNER_TEMP/baseline" 3c1f75ddd728e1edeca4891e0cfc00b1f294e79c
          (cd "$RUNNER_TEMP/baseline"; python3 -B qualification/verify-source-convergence.py; python3 -B qualification/verify-three-kernel-adoption.py)
          git worktree remove "$RUNNER_TEMP/baseline"
          test "$(git diff --name-only 3c1f75ddd728e1edeca4891e0cfc00b1f294e79c HEAD)" = "$(printf '%s\n' .github/workflows/managed-usb-id-diagnostics.yml experiments/pi-usb-fabric-r27/typed-kernel-runtime/Dockerfile.base)"
          git diff --check 3c1f75ddd728e1edeca4891e0cfc00b1f294e79c HEAD
      - name: Repeat actual three-kernel transport qualification
        run: |
          set -Eeuo pipefail
          export GITHUB_SHA="$(git rev-parse HEAD)"
          /usr/bin/time -v bash experiments/pi-usb-fabric-r27/typed-kernel-runtime/verify-product.sh
          log="$RUNNER_TEMP/r27-g-original-kernel-isolated-a-usbip.log"
          test -s "$log"
          if grep -F 'failed to open /usr/share/misc/usb.ids' "$log"; then exit 1; fi
          echo USB_ID_DATABASE_DIAGNOSTICS=PASS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: managed-diagnostics-evaluation-not-release
          path: ${{ runner.temp }}/r27-g-original-kernel-isolated-a-usbip.log
          retention-days: 7
          if-no-files-found: error
