name: QEMU USB device evaluation image
on:
  push:
    branches: [qualification/public-qemu-device-demo]
    paths: ['lab/qemu-usb-demo/**', '.github/workflows/qemu-usb-demo.yml']
  pull_request:
    paths: ['lab/qemu-usb-demo/**', '.github/workflows/qemu-usb-demo.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qemu-tcg:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install public distribution prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 nasm
          qemu-system-x86_64 --version
          nasm -v
      - name: Produce and qualify bootable image
        run: |
          python3 -I lab/qemu-usb-demo/run.py "$RUNNER_TEMP/qemu-evaluation"
          (cd "$RUNNER_TEMP/qemu-evaluation" && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qemu-usb-device-evaluation
          path: ${{ runner.temp }}/qemu-evaluation/
          retention-days: 7
          if-no-files-found: error
