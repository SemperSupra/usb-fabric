name: USB Fabric product-native three kernel legacy baseline
on:
  push:
    branches: [test/issue-11-three-kernel-adoption]
permissions:
  contents: read
concurrency:
  group: usb-fabric-three-kernel-adoption
  cancel-in-progress: false
jobs:
  three-real-kernels:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify exact source adoption and original shared core
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOWORK: 'off'
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 79633411bc7679c00d119dc72da90e725165fb2a
          python3 -B qualification/verify-three-kernel-adoption.py
          cd experiments/usb-fabric-r26/integrated
          go test -race -count=1 -timeout=120s ./...
          go vet ./...
      - name: Product-native original real USBIP A to B and HELD recovery refusal
        run: bash experiments/pi-usb-fabric-r27/typed-kernel-runtime/verify-product.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: three-kernel-qualification-not-release
          path: ${{ runner.temp }}/r27-g-original-kernel-isolated-a-usbip.log
          retention-days: 7
          if-no-files-found: warn
